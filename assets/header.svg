<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Farmer Market: Farmers selling straight to their customers.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#BC8CFF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B949E" opacity="0.18"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="16"/></clipPath>
    <style>
      .mono  { font: 500 15px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; }
      .name  { font: 700 48px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F0F6FC; letter-spacing: -1px; }
      .meta  { font: 400 18px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8B949E; }
      .stack { font: 500 15px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: url(#accent); }
      .label { font: 600 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #C9D1D9; }
      .small { font: 600 12px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8B949E; }
      .hub   { font: 700 13px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #F0F6FC; letter-spacing: 1px; }
      .flow { stroke-dasharray: 6 14; animation: dash 1.2s linear infinite; opacity: 0.55; }
      @keyframes dash { to { stroke-dashoffset: -40; } }
      .in { animation: in 0.8s ease-out backwards; }
      .i1 { animation-delay: 0.05s; } .i2 { animation-delay: 0.2s; } .i3 { animation-delay: 0.35s; } .i4 { animation-delay: 0.5s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="15.5" fill="none" stroke="#30363D" stroke-width="1.5"/>

    <text x="64" y="70" class="mono in i1">~/omeraydin00/farmer_market</text>
    <text x="62" y="130" class="name in i2">Farmer Market</text>
    <text x="64" y="172" class="meta in i3">Farmers selling straight to their customers.</text>
    <text x="64" y="212" class="stack in i4">Flutter · Firebase</text>

    <path d="M842 112 Q935 20 1028 112" stroke="#30363D" stroke-width="2" fill="none"/><path d="M842 112 Q935 20 1028 112" class="flow" stroke="#58A6FF" stroke-width="2" fill="none" style="animation-delay:0.0s"/>
    <path d="M1028 148 Q935 240 842 148" stroke="#30363D" stroke-width="2" fill="none"/><path d="M1028 148 Q935 240 842 148" class="flow" stroke="#58A6FF" stroke-width="2" fill="none" style="animation-delay:0.6s"/>
    <circle r="5" fill="#3FB950" opacity="0">
      <animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M842 112 Q935 20 1028 112"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#56D364" opacity="0">
      <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M842 112 Q935 20 1028 112"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#79C0FF" opacity="0">
      <animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite" path="M1028 148 Q935 240 842 148"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#D2A8FF" opacity="0">
      <animateMotion dur="2.6s" begin="1.9s" repeatCount="indefinite" path="M1028 148 Q935 240 842 148"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(780 130)">
      <rect x="-66" y="-30" width="132" height="60" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <g transform="translate(-42 0)" stroke="#3FB950" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 10 C-8 -4 0 -12 12 -12 C12 2 4 10 -8 10 Z M-8 10 L4 -2"/>
      </g>
      <text x="-22" y="5" class="label">Farmers</text>
    </g>
    <g transform="translate(1090 130)">
      <rect x="-66" y="-30" width="132" height="60" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <g transform="translate(-42 0)" stroke="#58A6FF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-10 -4 H10 L8 12 H-8 Z M-5 -4 V-8 a5 5 0 0 1 10 0 V-4"/>
      </g>
      <text x="-22" y="5" class="label">Customers</text>
    </g>
    <text x="935" y="52" text-anchor="middle" class="small">produce</text>
    <text x="935" y="218" text-anchor="middle" class="small">orders</text>
  </g>
</svg>
