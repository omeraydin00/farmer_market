name: farmer_market
description: "Farmer Market: çiftçilerin ürünlerini doğrudan müşteriye sattığı pazar yeri."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  provider: ^6.0.5
  cached_network_image: ^4.0.7
  intl: ^0.20.3
  cupertino_icons: ^2.0.0
  url_launcher: ^6.3.3
  google_fonts: ^9.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
